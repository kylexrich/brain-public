# Symlink Manifest — mbp-m4max-16
# =================================
# Tracks all symlinks managed for this machine.
#
# Format: LINK_PATH  BRAIN_PATH
#
#   LINK_PATH  — absolute path where symlink is created (~ expanded)
#   BRAIN_PATH — relative to brain repo root (~/Developer/brain/)
#
# Lines starting with # are comments. Blank lines are ignored.
# Run: system/symlinks/mbp-m4max-16/symlinks.sh {setup|teardown|status|verify}

# --- Claude Code ---
~/.claude/hooks                              system/.dot-claude/hooks
~/.claude.json                               system/.dot-claude/claude.json
~/.claude/CLAUDE.md                          system/.dot-claude/CLAUDE.md
~/Documents/Claude/Scheduled                 system/.dot-claude/Scheduled
~/.claude/settings.json                      system/.dot-claude/settings.json
~/.claude/plans                              system/.dot-claude/plans
~/.claude/skills                             system/.dot-claude/skills
~/.claude/backups                            system/.dot-claude/backups
# Deliberately NOT linked: ~/.claude/plugins/installed_plugins.json and
# known_marketplaces.json. Claude Code rewrites them atomically (temp file +
# rename), which replaces the symlink itself rather than following it — so the
# link broke on every plugin/marketplace change. The destination is gitignored
# anyway, so linking them bought no history or backup. They stay local-only.
~/.claude/plugins/blocklist.json             system/.dot-claude/plugins/blocklist.json
~/.claude/plugins/cache                      system/.dot-claude/plugins/cache
~/.claude/scheduled-tasks                    system/.dot-claude/scheduled-tasks
~/.claude/projects                           system/.dot-claude/projects
~/.claude/agents                             system/.dot-claude/agents
~/.claude/agent-memory                       system/.dot-claude/agent-memory
~/Library/Application Support/Claude/claude_desktop_config.json  system/.dot-claude/claude_desktop_config.json

# --- Shell ---
~/.zshrc                                     system/zshrc/mbp-m4max-16/.zshrc

# --- LaunchAgents ---
~/Library/LaunchAgents/com.kyle.bluebubbles-daemon.plist  system/launchd/com.kyle.bluebubbles-daemon.plist
~/Library/LaunchAgents/com.kyle.scheduler-daemon.plist    system/launchd/com.kyle.scheduler-daemon.plist

# --- OpenAI Codex ---
~/.codex/AGENTS.md                           system/.dot-codex/AGENTS.md
~/.codex/config.toml                         system/.dot-codex/config.toml
~/.codex/version.json                        system/.dot-codex/version.json
~/.codex/skills                              system/.dot-codex/skills
~/.codex/automations                         system/.dot-codex/automations
